name: 使用问题
description: 询问安装、设置或某项功能的使用方法。
title: '[Question] '
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        请用标题概括你的疑问，例如「[Question] 如何让下载的歌曲出现在本地曲库」。
        一条 Issue 只讨论一个问题；如果已经确认功能异常，可以选择「Bug 反馈」。
        不要提供密码、Cookie、Token 或其他登录凭据。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已查看 [常见问题](https://github.com/Px-asen/Twilight_Echo/blob/HEAD/README.md#常见问题)，并搜索已有的 [Issues](https://github.com/Px-asen/Twilight_Echo/issues)，仍未找到答案。
          required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 在「设置 → 关于」查看；安装前的问题可以填写「尚未安装」及准备使用的安装包名称。
      placeholder: 完整版本号，或尚未安装。
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: 操作系统与版本（选填）
      description: 安装、音频设备或系统集成相关的问题，建议补充系统信息。
      placeholder: 例如：Windows 11 24H2 x64
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 你想完成什么操作？在哪一步遇到了困难？
      placeholder: 例如：下载的歌曲已经保存在电脑里，但在本地曲库中找不到，需要怎样添加？
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: 已经尝试的方法
      description: 请说明尝试过的操作及结果。如果不知道从哪里开始，也可以直接说明。
      placeholder: 例如：已检查下载目录，并点击重新扫描，但仍然没有找到这些歌曲。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 相关设置、截图或补充信息（选填）
      description: 可以粘贴截图或拖入附件；涉及音乐来源、输出设备或插件时，请补充相应名称和版本，并删除私人信息。
      placeholder: 与问题相关的设置、插件信息或截图。
    validations:
      required: false
