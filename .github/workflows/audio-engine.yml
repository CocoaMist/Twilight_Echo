name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository Quality
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frozen dependency tree
        run: pnpm install --frozen-lockfile

      - name: Prepare Windows bridge compiler
        shell: pwsh
        run: |
          $compiler = (Get-Command g++.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $compiler = @(
              'C:\mingw64\bin\g++.exe',
              'C:\msys64\mingw64\bin\g++.exe',
              'C:\msys64\ucrt64\bin\g++.exe'
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Windows VST3 bridge tests require a MinGW C++ compiler' }
          $compilerBin = Split-Path -Parent $compiler
          "W64DEVKIT_ROOT=$(Split-Path -Parent $compilerBin)" >> $env:GITHUB_ENV
          $compilerBin >> $env:GITHUB_PATH
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows bridge compiler could not start' }

      - name: Verify dependency install policy
        run: pnpm run verify:install-policy

      - name: Verify NCM dependency patch
        run: pnpm run verify:ncm-patch

      - name: Test release delivery policy
        run: pnpm run test:release-artifacts

      - name: Test production dependency audit gate
        run: pnpm run test:production-audit

      - name: Audit production dependency tree
        run: pnpm run audit:production -- --output "$RUNNER_TEMP/production-dependency-audit.json"

      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: ${{ runner.temp }}/production-dependency-audit.json
          if-no-files-found: warn

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test macro quality policy
        run: pnpm run test:quality-policy

      - name: Test product behavior
        run: pnpm run test:product -- --report "$RUNNER_TEMP/product-quality-gate.json"

      - name: Upload product quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-quality-gate
          path: ${{ runner.temp }}/product-quality-gate.json
          if-no-files-found: warn

      - name: Verify duplicate detection benchmark contract
        run: pnpm run test:duplicate-detection-benchmark

      - name: Run isolated duplicate detection 10k benchmark
        run: >-
          pnpm run benchmark:duplicate-detection:ci --
          --output "$RUNNER_TEMP/duplicate-detection-benchmark.json"
          --manifest "$RUNNER_TEMP/duplicate-detection-benchmark.manifest.json"

      - name: Upload duplicate detection benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-detection-benchmark
          path: |
            ${{ runner.temp }}/duplicate-detection-benchmark.json
            ${{ runner.temp }}/duplicate-detection-benchmark.manifest.json
          if-no-files-found: warn

      - name: Production build
        run: pnpm run build

  native-audio:
    name: Native Audio (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure audio engine
        run: cmake -S audio-engine -B audio-engine/build/default -DTAE_BUILD_NAPI=OFF

      - name: Build audio engine
        run: cmake --build audio-engine/build/default --config Debug

      - name: Test audio engine
        run: ctest --test-dir audio-engine/build/default --output-on-failure --timeout 180 -C Debug

  mac-release:
    name: macOS Release Package
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frozen dependency tree
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Configure audio engine (Node-API)
        run: >-
          cmake -S audio-engine -B audio-engine/build/default
          -DTAE_BUILD_NAPI=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"

      - name: Build audio engine
        run: cmake --build audio-engine/build/default --config Release

      - name: Stage native audio engine
        run: node scripts/stage-audio-engine.cjs --build-dir audio-engine/build/default

      - name: Build and package macOS app
        run: pnpm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  required:
    name: Required Quality Gate
    if: always()
    needs: [repository, native-audio]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Require every quality job
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          NATIVE_AUDIO_RESULT: ${{ needs.native-audio.result }}
        run: |
          test "$REPOSITORY_RESULT" = "success"
          test "$NATIVE_AUDIO_RESULT" = "success"
