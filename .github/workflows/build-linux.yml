name: Build Linux packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish the built packages to this release tag (for example v1.3.1). Leave empty to only build artifacts.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    name: Linux (AppImage / deb / rpm / tar.gz)
    # Keep release binaries on the validated LTS instead of following ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            nasm \
            yasm \
            curl \
            zip \
            unzip \
            tar
          # AppImage 打包工具在部分镜像上需要 FUSE（Ubuntu 24.04 包名为 libfuse2t64）。
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('audio-engine/vcpkg.json') }}

      - name: Build Linux audio engine (default preset + Node-API bridge)
        run: |
          # runner.home 不是有效的 Actions 上下文，这里直接用 $HOME。
          export VCPKG_ROOT="$HOME/vcpkg"
          cmake -S audio-engine -B audio-engine/build/default \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DTAE_BUILD_NAPI=ON \
            -DTAE_BUILD_TESTS=OFF
          cmake --build audio-engine/build/default
          test -f audio-engine/build/default/libtwilight-audio-engine.so
          test -f audio-engine/build/default/twilight_audio_node.node

      - name: Build renderer and package Linux targets
        run: |
          pnpm run build
          pnpm exec electron-builder --linux --config electron-builder.yml --publish never

      - name: Verify staged native engine in the unpacked app
        run: |
          ls -la dist/linux-unpacked/resources/audio-engine/
          test -f dist/linux-unpacked/resources/audio-engine/libtwilight-audio-engine.so
          test -f dist/linux-unpacked/resources/audio-engine/twilight_audio_node.node

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: twilight-echo-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Linux packages
    needs: linux
    # A tag push publishes automatically; manual runs must name an existing tag.
    if: needs.linux.result == 'success' && (github.event_name == 'push' || inputs.release_tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: twilight-echo-linux
          path: release-assets

      - name: Verify the release tag matches the packaged version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$RELEASE_TAG"

      - name: Write SHA-256 companion files
        run: node scripts/release-assets.cjs checksum release-assets

      - name: Create the draft release when it does not exist yet
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          notes_file="docs/release-notes/${RELEASE_TAG#v}.md"
          create_args=(--draft --verify-tag --title "Twilight Echo ${RELEASE_TAG#v}")
          if [ -f "$notes_file" ]; then
            # Another platform workflow may create the same release concurrently.
            gh release create "$RELEASE_TAG" "${create_args[@]}" --notes-file "$notes_file" \
              || gh release view "$RELEASE_TAG" >/dev/null
          else
            gh release create "$RELEASE_TAG" "${create_args[@]}" --generate-notes \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi

      - name: Upload Linux packages
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Verify the Linux packages are attached
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          node scripts/release-assets.cjs verify --assets release-assets.json \
            --version "${RELEASE_TAG#v}" --platform linux

      - name: Publish the release once every platform is attached
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          if node scripts/release-assets.cjs verify --assets release-assets.json \
            --version "${RELEASE_TAG#v}" --platform all; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            echo "Waiting for the remaining platform packages; the release stays draft."
          fi
