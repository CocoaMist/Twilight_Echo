name: Build macOS packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish the built packages to this release tag (for example v1.3.1). Leave empty to only build artifacts.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }} (dmg / zip)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            cmake_arch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Build macOS audio engine (Node-API bridge)
        run: |
          cmake -S audio-engine -B audio-engine/build/default \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DTAE_BUILD_NAPI=ON \
            -DTAE_BUILD_TESTS=OFF
          cmake --build audio-engine/build/default --config Release
          test -f audio-engine/build/default/libtwilight-audio-engine.dylib
          test -f audio-engine/build/default/twilight_audio_node.node

      - name: Stage native audio engine
        run: node scripts/stage-audio-engine.cjs --build-dir audio-engine/build/default

      - name: Build and package macOS target
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm run build
          pnpm exec electron-builder --mac --${{ matrix.arch }} --config electron-builder.yml --publish never

      - name: Verify staged native engine in the packaged app
        run: |
          runtime_dir="$(find dist -path '*/TwilightEcho.app/Contents/Resources/audio-engine' -type d -print -quit)"
          test -n "$runtime_dir"
          test -f "$runtime_dir/libtwilight-audio-engine.dylib"
          test -f "$runtime_dir/twilight_audio_node.node"
          node scripts/macos-audio-runtime.cjs --runtime-dir "$runtime_dir"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: twilight-echo-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish macOS packages
    needs: macos
    # A tag push publishes automatically; manual runs must name an existing tag.
    if: needs.macos.result == 'success' && (github.event_name == 'push' || inputs.release_tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: twilight-echo-macos-*
          path: release-assets
          merge-multiple: true

      - name: Verify the release tag matches the packaged version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$RELEASE_TAG"

      - name: Write SHA-256 companion files
        run: node scripts/release-assets.cjs checksum release-assets

      - name: Create the draft release when it does not exist yet
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          notes_file="docs/release-notes/${RELEASE_TAG#v}.md"
          create_args=(--draft --verify-tag --title "Twilight Echo ${RELEASE_TAG#v}")
          if [ -f "$notes_file" ]; then
            # Another platform workflow may create the same release concurrently.
            gh release create "$RELEASE_TAG" "${create_args[@]}" --notes-file "$notes_file" \
              || gh release view "$RELEASE_TAG" >/dev/null
          else
            gh release create "$RELEASE_TAG" "${create_args[@]}" --generate-notes \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi

      - name: Upload macOS packages
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Verify the macOS packages are attached
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          node scripts/release-assets.cjs verify --assets release-assets.json \
            --version "${RELEASE_TAG#v}" --platform macos

      - name: Publish the release once every platform is attached
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          if node scripts/release-assets.cjs verify --assets release-assets.json \
            --version "${RELEASE_TAG#v}" --platform all; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            echo "Waiting for the remaining platform packages; the release stays draft."
          fi
